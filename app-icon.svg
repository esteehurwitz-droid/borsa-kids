<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient circle -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#00b09b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#96c93d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main circle background -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGradient)"/>

  <!-- Inner white circle -->
  <circle cx="256" cy="256" r="220" fill="white" opacity="0.95"/>

  <!-- Stock chart bars (gaming/fun style) -->
  <g transform="translate(120, 180)">
    <!-- Bar 1 -->
    <rect x="0" y="100" width="35" height="100" fill="url(#chartGradient)" rx="8"/>
    <circle cx="17.5" cy="95" r="8" fill="#00b09b"/>

    <!-- Bar 2 (higher) -->
    <rect x="50" y="60" width="35" height="140" fill="#667eea" rx="8" opacity="0.8"/>
    <circle cx="67.5" cy="55" r="8" fill="#667eea"/>

    <!-- Bar 3 (highest) -->
    <rect x="100" y="20" width="35" height="180" fill="#764ba2" rx="8" opacity="0.9"/>
    <circle cx="117.5" cy="15" r="8" fill="#764ba2"/>

    <!-- Bar 4 (medium) -->
    <rect x="150" y="80" width="35" height="120" fill="#00b09b" rx="8" opacity="0.7"/>
    <circle cx="167.5" cy="75" r="8" fill="#00b09b"/>
  </g>

  <!-- Upward arrow (success/growth) -->
  <g transform="translate(300, 240)">
    <path d="M 0 40 L 40 0 L 80 40 M 40 0 L 40 80" stroke="#00b09b" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- XP Star (gaming element) -->
  <g transform="translate(360, 120)">
    <polygon points="0,-30 7,-10 30,-5 15,10 20,33 0,20 -20,33 -15,10 -30,-5 -7,-10" fill="#ffd700"/>
    <text x="-8" y="8" font-size="24" font-weight="bold" fill="#ff416c">XP</text>
  </g>

  <!-- Currency symbol (fun money) -->
  <g transform="translate(120, 320)">
    <circle cx="0" cy="0" r="25" fill="#ffd700" opacity="0.8"/>
    <text x="-8" y="10" font-size="32" font-weight="bold" fill="#0f3460">₪</text>
  </g>

  <!-- Game controller bracket (gaming feel) -->
  <g transform="translate(340, 340)">
    <circle cx="-15" cy="0" r="8" fill="#667eea"/>
    <circle cx="0" cy="-15" r="8" fill="#667eea"/>
    <circle cx="15" cy="0" r="8" fill="#667eea"/>
    <circle cx="0" cy="15" r="8" fill="#667eea"/>
    <line x1="-12" y1="-12" x2="12" y2="12" stroke="#667eea" stroke-width="2"/>
    <line x1="12" y1="-12" x2="-12" y2="12" stroke="#667eea" stroke-width="2"/>
  </g>

  <!-- Centered game title badge -->
  <g transform="translate(256, 440)">
    <rect x="-60" y="-15" width="120" height="30" rx="15" fill="#667eea" opacity="0.2"/>
    <text x="0" y="5" font-size="16" font-weight="bold" fill="#0f3460" text-anchor="middle">בורסת הילדים</text>
  </g>
</svg>
